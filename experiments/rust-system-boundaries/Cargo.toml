[workspace]
resolver = "3"
members = [
  "crates/atomic-state-file",
  "crates/boundary-protocol",
  "crates/supervisor",
  "crates/guardian",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"
version = "0.0.0-spike"

[workspace.dependencies]
base64 = "=0.23.0"
ed25519-dalek = "=3.0.0"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
