schemaVersion: 1
workspace:
  kind: pnpm
  manifest: pnpm-workspace.yaml
governedRoots:
  - experiments
  - packages/apps/embedded-runtime/src
  - packages/contexts/agent-execution/src
  - packages/contexts/provider-access/src
  - packages/contexts/runtime-configuration/src
  - packages/contexts/runtime-security/src
  - packages/platform/filesystem-custody/src
  - scripts/foundation
boundaries:
  - id: production.agent-execution
    dependencyMode: runtime
    roots:
      - packages/contexts/agent-execution/src
    entrypoints:
      - packages/contexts/agent-execution/src/index.ts
      - packages/contexts/agent-execution/src/composition.ts
    allow:
      boundaries: []
      packages:
        - "@agent-teams/filesystem-custody"
        - pg
        - zod
      builtins:
        - node:child_process
        - node:crypto
        - node:fs
        - node:fs/promises
        - node:path
        - node:timers/promises
      runtimeReferences: []
  - id: production.provider-access
    dependencyMode: runtime
    roots:
      - packages/contexts/provider-access/src
    entrypoints:
      - packages/contexts/provider-access/src/index.ts
      - packages/contexts/provider-access/src/composition.ts
    allow:
      boundaries: []
      packages: []
      builtins: []
      runtimeReferences: []
  - id: production.runtime-configuration
    dependencyMode: runtime
    roots:
      - packages/contexts/runtime-configuration/src
    entrypoints:
      - packages/contexts/runtime-configuration/src/index.ts
      - packages/contexts/runtime-configuration/src/composition.ts
    allow:
      boundaries: []
      packages:
        - "@agent-teams/filesystem-custody"
        - jsonc-parser
        - smol-toml
      builtins:
        - node:crypto
        - node:fs
        - node:fs/promises
      runtimeReferences: []
  - id: production.runtime-security
    dependencyMode: runtime
    roots:
      - packages/contexts/runtime-security/src
    entrypoints:
      - packages/contexts/runtime-security/src/index.ts
      - packages/contexts/runtime-security/src/composition.ts
    allow:
      boundaries: []
      packages:
        - "@agent-teams/filesystem-custody"
      builtins:
        - node:crypto
        - node:fs
        - node:fs/promises
        - node:path
      runtimeReferences: []
  - id: production.filesystem-custody
    dependencyMode: runtime
    roots:
      - packages/platform/filesystem-custody/src
    entrypoints:
      - packages/platform/filesystem-custody/src/index.ts
    allow:
      boundaries: []
      packages: []
      builtins:
        - node:fs
        - node:fs/promises
        - node:path
      runtimeReferences: []
  - id: production.embedded-runtime
    dependencyMode: runtime
    roots:
      - packages/apps/embedded-runtime/src
    entrypoints:
      - packages/apps/embedded-runtime/src/index.ts
      - packages/apps/embedded-runtime/src/composition.ts
    allow:
      boundaries: []
      packages:
        - "@agent-teams/agent-execution"
        - "@agent-teams/runtime-configuration"
        - "@agent-teams/runtime-security"
      builtins:
        - node:crypto
        - node:timers/promises
      runtimeReferences: []
  - id: experiments.typescript-evidence
    dependencyMode: development
    roots:
      - experiments/runtime-profile-behavior
      - experiments/rust-system-boundaries/client
      - experiments/rust-system-boundaries/evidence
    entrypoints: []
    allow:
      boundaries: []
      packages:
        - "@xstate/graph"
        - ajv
        - fast-check
        - json-schema-to-typescript
        - jsonc-parser
        - xstate
        - zod
      builtins:
        - node:assert/strict
        - node:child_process
        - node:crypto
        - node:fs
        - node:fs/promises
        - node:os
        - node:path
        - node:perf_hooks
        - node:readline
        - node:test
        - node:timers/promises
        - node:url
        - node:util
      runtimeReferences: []
  - id: tooling.foundation-scaffolding
    dependencyMode: development
    roots:
      - scripts/foundation
    entrypoints: []
    allow:
      boundaries: []
      packages: []
      builtins:
        - node:child_process
        - node:fs/promises
        - node:os
        - node:path
        - node:url
        - node:util
      runtimeReferences: []
