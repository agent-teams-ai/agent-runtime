# needs an exact path/line/rule waiver with an owner, a decision and an expiry of
# at most 90 days; never auto-renew, and delete the waiver with its directive.
# The 19 waivers below sit in frozen contained-turn code, which is not developed
# or refactored (architecture program plan, decision 32). The waivers recorded
# with PR #171 expired on 2026-10-14; PR #234 records a fresh bounded decision for
# the same 19 directives. Per-file caps in .oxlintrc.json cannot replace them yet,
# because the type-aware quality gate (lint:typed) refuses relaxed limits for
