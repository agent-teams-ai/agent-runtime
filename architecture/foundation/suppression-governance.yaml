# Inline suppression waivers. Every inline lint suppression in a governed root
# needs an exact path/line/rule waiver with an owner, a decision and an expiry of
# at most 90 days; never auto-renew, and delete the waiver with its directive.
# The 19 waivers recorded with PR #171 expired on 2026-10-14. All of them sat in
# frozen contained-turn code (architecture program plan, decision 32), so their
# directives were removed and each affected file got a per-file cap in
# .oxlintrc.json equal to its measured value: the code may not get worse, and
# the caps move unchanged into the shrink-only findings baseline of Engineering
# Foundation 1.8.0 when agent-runtime adopts it. Active code keeps the strict
# limits and this waiver process.
schemaVersion: 1
governedRoots:
  - experiments
  - scripts
  - packages/apps/embedded-runtime/src
  - packages/contexts/agent-execution/src
  - packages/contexts/provider-access/src
  - packages/contexts/runtime-configuration/src
  - packages/contexts/runtime-security/src
  - packages/platform/filesystem-custody/src
  - packages/platform/filesystem-custody/native
nonWaivableRulePrefixes:
  - access-control.
  - security.
waivers: []
