schemaVersion: 1
instructions:
  canonical: AGENTS.md
  claude: CLAUDE.md
  gemini: GEMINI.md
  copilot: .github/copilot-instructions.md
scripts:
  changed: check:changed
  fast: check:fast
  full: check
changedChecks:
  - id: lint
    script: lint:changed
    extensions: [.ts, .tsx, .mts, .cts]
    passPaths: true
  - id: typecheck
    script: typecheck
    extensions: [.ts, .tsx, .mts, .cts]
    passPaths: false
  - id: test
    script: test
    extensions: [.ts, .tsx, .mts, .cts]
    passPaths: false
  - id: rust-boundaries
    script: spike:rust-boundaries
    extensions: [.rs, .toml, .lock]
    passPaths: false
fullScanPaths:
  - .oxlintrc.json
  - .github/workflows
  - architecture/foundation
  - architecture/decisions
  - docs
  - docs/architecture/qualification-registry.json
  - experiments/runtime-profile-behavior/spec/runtime-operation-oracle
  - experiments/runtime-profile-behavior/src/features/evidence/generate-runtime-operation-oracle.ts
  - experiments/runtime-profile-behavior/src/features/evidence/runtime-operation-oracle-authority.ts
  - experiments/runtime-profile-behavior/src/features/evidence/runtime-operation-oracle-evaluator.ts
  - experiments/runtime-profile-behavior/src/features/evidence/runtime-operation-binary-retention-oracle.ts
  - experiments/runtime-profile-behavior/src/features/evidence/runtime-operation-root-lifecycle-oracle.ts
  - experiments/runtime-profile-behavior/src/features/evidence/runtime-operation-state-product.ts
  - experiments/runtime-profile-behavior/src/features/evidence/runtime-operation-xstate-builder.ts
  - experiments/runtime-profile-behavior/src/features/evidence/validate-runtime-operation-oracle.ts
  - experiments/runtime-profile-behavior/test/runtime-operation-oracle-properties.test.ts
  - experiments/runtime-profile-behavior/test/runtime-operation-oracle.test.ts
  - foundation.config.yaml
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - scripts/foundation
  - tsconfig.json
