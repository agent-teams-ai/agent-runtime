schemaVersion: 1
instructions:
  canonical: AGENTS.md
  claude: CLAUDE.md
  gemini: GEMINI.md
  copilot: .github/copilot-instructions.md
scripts:
  changed: check:changed
  fast: check:fast
  full: check
changedChecks:
  - id: lint
    script: lint:changed
    extensions: [.ts, .tsx, .mts, .cts]
    passPaths: true
  - id: typecheck
    script: typecheck
    extensions: [.ts, .tsx, .mts, .cts]
    passPaths: false
  - id: test
    script: test
    extensions: [.ts, .tsx, .mts, .cts]
    passPaths: false
  - id: rust-boundaries
    script: spike:rust-boundaries
    extensions: [.rs, .toml, .lock]
    passPaths: false
fullScanPaths:
  - .oxlintrc.json
  - .github/workflows
  - architecture/foundation
  - architecture/decisions
  - docs
  - docs/architecture/qualification-registry.json
  - foundation.config.yaml
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - scripts/foundation
  - tsconfig.json
