schemaVersion: 2
projectId: agent-runtime

catalog:
  metadataSchemaPath: docs/document-metadata.schema.json
  metadataSidecar:
    kind: path-metadata-map
    path: docs/document-metadata.yaml
  ownerCatalog:
    path: docs/owners.yaml
    contract: foundation.owner-map/v1
  collections:
    - kind: markdown-tree
      root: docs
  excludedPrefixes:
    - docs/templates

authoring:
  mode: create-only
  artifactTypes:
    - type: index
      initialStatus: active
      allowedOwnerIds:
        - architecture
      identity:
        kind: explicit
        format: qualified
        grammar:
          prefixSegments:
            - runtime
            - index
          minSuffixSegments: 1
          maxSuffixSegments: 8
      placement:
        kind: qualified-leaf-index
        root: docs
        requiredBasename: README.md
      template:
        kind: fenced-markdown-body
        path: docs/templates/index.md
      heading:
        kind: title
      reachability:
        kind: not-required
        reason: Index documents are explicit reachability roots for their governed subtree.

    - type: architecture
      initialStatus: active
      allowedOwnerIds:
        - architecture
        - architecture/tooling
        - architecture/qualification
      identity:
        kind: explicit
        format: qualified
        grammar:
          prefixSegments:
            - runtime
            - architecture
          minSuffixSegments: 1
          maxSuffixSegments: 8
      placement:
        kind: collection
        directory: docs/architecture
        filename: slug
      template:
        kind: fenced-markdown-body
        path: docs/templates/architecture.md
      heading:
        kind: title
      reachability:
        kind: manual-fixed-index
        indexPath: docs/architecture/README.md

    - type: adr
      initialStatus: proposed
      allowedOwnerIds:
        - architecture
        - architecture/tooling
      identity:
        kind: explicit
        format: adr-four-digits
      placement:
        kind: collection
        directory: docs/decisions
        filename: numeric-id-slug
      template:
        kind: fenced-markdown-body
        path: docs/templates/adr.md
      heading:
        kind: id-colon-title
      reachability:
        kind: manual-fixed-index
        indexPath: docs/decisions/README.md

    - type: evidence
      initialStatus: evidence-reference
      allowedOwnerIds:
        - architecture/qualification
      identity:
        kind: explicit
        format: qualified
        grammar:
          prefixSegments:
            - evidence
          minSuffixSegments: 1
          maxSuffixSegments: 8
      placement:
        kind: collection
        directory: docs/spikes
        filename: slug
      template:
        kind: fenced-markdown-body
        path: docs/templates/evidence.md
      heading:
        kind: title
      reachability:
        kind: manual-fixed-index
        indexPath: docs/README.md

    - type: qualification-plan
      initialStatus: proposed
      allowedOwnerIds:
        - architecture/qualification
      identity:
        kind: explicit
        format: qualified
        grammar:
          prefixSegments:
            - qualification
          minSuffixSegments: 1
          maxSuffixSegments: 8
      placement:
        kind: collection
        directory: docs/spikes
        filename: slug
      template:
        kind: fenced-markdown-body
        path: docs/templates/qualification-plan.md
      heading:
        kind: title
      reachability:
        kind: manual-fixed-index
        indexPath: docs/README.md
