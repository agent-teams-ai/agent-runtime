name: Full CI lane

on:
  workflow_call:
    inputs:
      regressions:
        type: boolean
        default: false
      base-revision:
        type: string
        default: ''
      script:
        required: true
        type: string
      revision:
        required: true
        type: string
      artifact:
        required: true
        type: string
      arm:
        type: string
        default: production

permissions:
  contents: read

jobs:
  lane:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 35
    env:
      GIT_AUTHOR_NAME: iliya
      GIT_AUTHOR_EMAIL: iliyazelenkog@gmail.com
      GIT_COMMITTER_NAME: iliya
      GIT_COMMITTER_EMAIL: iliyazelenkog@gmail.com
    steps:
      - name: Checkout exact event or benchmark revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify checkout before running repository code
        shell: bash
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          BENCHMARK_ARM: ${{ inputs.arm }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          if [ "$BENCHMARK_ARM" != production ]; then
            test "$EXPECTED_REVISION" = "$GITHUB_WORKFLOW_SHA"
          fi
      - name: Retain exact C0 review history before repository code
        shell: bash
        run: |
          set -euo pipefail
          object=8e5e859d10981e1623d0617e933afc68a9e8770c
          if ! git cat-file -e "$object^{commit}"; then
            git fetch --no-tags origin "$object"
          fi
          test "$(git rev-parse "$object^{commit}")" = "$object"
          git fsck --connectivity-only --no-reflogs "$object"
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Verify typed revision binding
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          BENCHMARK_ARM: ${{ inputs.arm }}
        run: node scripts/ci/gate.ts revision
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Observe current frozen store integrity for PR sampling
        if: ${{ inputs.regressions }}
        shell: bash
        run: |
          set -euo pipefail
          # Failed/unavailable integrity keeps sampling FULL; no past pass is used.
          if pnpm store status; then
            echo 'PR_REGRESSION_FROZEN_INSTALL=verified' >> "$GITHUB_ENV"
          fi

      - name: Execute current-source PR obligations and whole regression decisions
        if: ${{ inputs.regressions }}
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          EXPECTED_BASE_REVISION: ${{ inputs.base-revision }}
          CI_EVIDENCE_DIR: ${{ runner.temp }}/ci-evidence
          PR_REGRESSION_GROUP: ${{ inputs.script }}
        run: node scripts/ci/pr-regression-command.ts "$PR_REGRESSION_GROUP"
      - name: Source quality
        if: ${{ !inputs.regressions && (inputs.script == 'check' || inputs.script == 'check:ci:quick') }}
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          BENCHMARK_ARM: ${{ inputs.arm }}
          CI_EVIDENCE_DIR: ${{ runner.temp }}/ci-evidence
        run: node scripts/ci/measure.ts check:ci:quick
      - name: Foundation
        if: ${{ !inputs.regressions && (inputs.script == 'check' || inputs.script == 'check:ci:foundation') }}
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          BENCHMARK_ARM: ${{ inputs.arm }}
          CI_EVIDENCE_DIR: ${{ runner.temp }}/ci-evidence
        run: node scripts/ci/measure.ts check:ci:foundation
      - name: Architecture
        if: ${{ !inputs.regressions && (inputs.script == 'check' || inputs.script == 'check:ci:architecture') }}
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          BENCHMARK_ARM: ${{ inputs.arm }}
          CI_EVIDENCE_DIR: ${{ runner.temp }}/ci-evidence
        run: node scripts/ci/measure.ts check:ci:architecture
      - name: Docs at checked out head
        if: ${{ !inputs.regressions && (inputs.script == 'check' || inputs.script == 'check:ci:docs') }}
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          BENCHMARK_ARM: ${{ inputs.arm }}
          CI_EVIDENCE_DIR: ${{ runner.temp }}/ci-evidence
        run: node scripts/ci/measure.ts check:ci:docs
      - name: check:ci:product:packages
        if: ${{ !inputs.regressions && (inputs.script == 'check' || inputs.script == 'check:ci:product') }}
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          BENCHMARK_ARM: ${{ inputs.arm }}
          CI_EVIDENCE_DIR: ${{ runner.temp }}/ci-evidence
        run: node scripts/ci/measure.ts check:ci:product:packages
      - name: check:ci:product:root
        if: ${{ !inputs.regressions && (inputs.script == 'check' || inputs.script == 'check:ci:product') }}
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          BENCHMARK_ARM: ${{ inputs.arm }}
          CI_EVIDENCE_DIR: ${{ runner.temp }}/ci-evidence
        run: node scripts/ci/measure.ts check:ci:product:root
      - name: check:ci:product:typed
        if: ${{ !inputs.regressions && (inputs.script == 'check' || inputs.script == 'check:ci:product') }}
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          BENCHMARK_ARM: ${{ inputs.arm }}
          CI_EVIDENCE_DIR: ${{ runner.temp }}/ci-evidence
        run: node scripts/ci/measure.ts check:ci:product:typed
      - name: check:ci:product:native
        if: ${{ !inputs.regressions && (inputs.script == 'check' || inputs.script == 'check:ci:product') }}
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          BENCHMARK_ARM: ${{ inputs.arm }}
          CI_EVIDENCE_DIR: ${{ runner.temp }}/ci-evidence
        run: node scripts/ci/measure.ts check:ci:product:native
      - name: Retain phase and test identity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-ci-${{ inputs.artifact }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Advisory quality diagnostics
        if: ${{ inputs.arm == 'production' && inputs.script == 'check:ci:product' }}
        continue-on-error: true
        run: pnpm quality:diagnostic
