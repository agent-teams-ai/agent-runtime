name: Rust System Boundaries

on:
  pull_request:
    paths:
      - experiments/rust-system-boundaries/**
      - .github/workflows/rust-system-boundaries.yml
      - .github/workflows/rust-system-boundaries-release-drill.yml
      - docs/spikes/rust-system-boundaries-production-gates.md
      - .node-version
  push:
    branches:
      - main
      - spike/rust-system-boundaries
    paths:
      - experiments/rust-system-boundaries/**
      - .github/workflows/rust-system-boundaries.yml
      - .github/workflows/rust-system-boundaries-release-drill.yml
      - docs/spikes/rust-system-boundaries-production-gates.md
      - .node-version
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-system-boundaries-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Install and verify the experiment's Rust toolchain
        working-directory: experiments/rust-system-boundaries
        shell: bash
        run: |
          set -euo pipefail

          toolchain_file='rust-toolchain.toml'
          toolchain="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' "$toolchain_file")"
          profile="$(sed -nE 's/^[[:space:]]*profile[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' "$toolchain_file")"
          components_csv="$(sed -nE 's/^[[:space:]]*components[[:space:]]*=[[:space:]]*\[(.*)\][[:space:]]*$/\1/p' "$toolchain_file" | tr -d '[:space:]"')"

          for value in "$toolchain" "$profile" "$components_csv"; do
            test -n "$value"
            test "$(printf '%s\n' "$value" | wc -l | tr -d ' ')" = '1'
          done

          IFS=',' read -r -a components <<< "$components_csv"
          install_args=("$toolchain" --profile "$profile")
          for component in "${components[@]}"; do
            test -n "$component"
            install_args+=(--component "$component")
          done

          rustup toolchain install "${install_args[@]}"

          active_toolchain="$(rustup show active-toolchain | sed -n '1s/ .*//p')"
          case "$active_toolchain" in
            "$toolchain"|"$toolchain"-*) ;;
            *)
              echo "rust-toolchain.toml selected $toolchain, but rustup activated $active_toolchain" >&2
              exit 1
              ;;
          esac

          rustup run "$toolchain" rustc --version --verbose
          rustup run "$toolchain" cargo --version

      - name: Check formatting
        working-directory: experiments/rust-system-boundaries
        run: cargo fmt --manifest-path Cargo.toml --all -- --check

      - name: Lint workspace
        working-directory: experiments/rust-system-boundaries
        run: cargo clippy --locked --workspace --all-targets --manifest-path Cargo.toml -- -D warnings

      - name: Test workspace
        working-directory: experiments/rust-system-boundaries
        run: cargo test --locked --workspace --all-targets --manifest-path Cargo.toml

      - name: Test TypeScript to Rust boundaries
        run: >-
          node --test --test-concurrency=1
          experiments/rust-system-boundaries/client/guardian-conformance.test.ts
          experiments/rust-system-boundaries/client/protocol-compat/v1-v2-compat.test.ts

      - name: Provision an isolated Linux cgroup v2 evidence root
        if: matrix.runner == 'ubuntu-24.04'
        id: linux_cgroup
        shell: bash
        run: |
          set -euo pipefail

          workload_uid="$(id -u)"
          workload_gid="$(id -g)"
          [[ "$workload_uid" =~ ^[1-9][0-9]*$ ]]
          [[ "$workload_gid" =~ ^[1-9][0-9]*$ ]]
          test "$(stat --file-system --format=%T /sys/fs/cgroup)" = 'cgroup2fs'
          root="/sys/fs/cgroup/agent-runtime-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo install --directory --owner=root --group=root --mode=0700 "$root"
          {
            printf 'root=%s\n' "$root"
            printf 'workload_uid=%s\n' "$workload_uid"
            printf 'workload_gid=%s\n' "$workload_gid"
          } >> "$GITHUB_OUTPUT"
          test "$(sudo stat --format='%u:%g:%a' "$root")" = '0:0:700'
          sudo test -f "$root/cgroup.procs"
          sudo test -w "$root/cgroup.procs"
          sudo test -f "$root/cgroup.kill"
          sudo test -w "$root/cgroup.kill"
          test "$(sudo awk '$1 == "populated" { print $2 }' "$root/cgroup.events")" = '0'
          test -z "$(sudo cat "$root/cgroup.procs")"
          test -z "$(sudo find "$root" -mindepth 1 -maxdepth 1 -type d -print -quit)"

      - name: Prove Linux cgroup v2 hostile-tree containment
        if: matrix.runner == 'ubuntu-24.04'
        working-directory: experiments/rust-system-boundaries
        shell: bash
        env:
          AGENT_RUNTIME_CGROUP_V2_E2E_ROOT: ${{ steps.linux_cgroup.outputs.root }}
          AGENT_RUNTIME_CGROUP_V2_E2E_WORKLOAD_UID: ${{ steps.linux_cgroup.outputs.workload_uid }}
          AGENT_RUNTIME_CGROUP_V2_E2E_WORKLOAD_GID: ${{ steps.linux_cgroup.outputs.workload_gid }}
        run: |
          set -euo pipefail

          sudo env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "AGENT_RUNTIME_CGROUP_V2_E2E_ROOT=$AGENT_RUNTIME_CGROUP_V2_E2E_ROOT" \
            "AGENT_RUNTIME_CGROUP_V2_E2E_WORKLOAD_UID=$AGENT_RUNTIME_CGROUP_V2_E2E_WORKLOAD_UID" \
            "AGENT_RUNTIME_CGROUP_V2_E2E_WORKLOAD_GID=$AGENT_RUNTIME_CGROUP_V2_E2E_WORKLOAD_GID" \
            cargo test --locked --test unix_containment_evidence \
              linux_cgroup_v2_e2e_proves_atomic_placement_privilege_drop_tree_kill_and_orphan_scan \
              -- --ignored --exact

      - name: Clean up Linux cgroup v2 evidence root
        if: ${{ always() && matrix.runner == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -euo pipefail

          root='${{ steps.linux_cgroup.outputs.root }}'
          if [ -z "$root" ]; then
            exit 0
          fi
          case "$root" in
            /sys/fs/cgroup/agent-runtime-e2e-[0-9]*-[0-9]*) ;;
            *)
              echo "refusing to clean an unexpected cgroup path: $root" >&2
              exit 1
              ;;
          esac
          [[ "$root" =~ ^/sys/fs/cgroup/agent-runtime-e2e-[0-9]+-[0-9]+$ ]]
          if ! sudo test -d "$root"; then
            exit 0
          fi
          test "$(sudo stat --format='%u:%g:%a' "$root")" = '0:0:700'

          # Kill through the trusted, fresh root first. This covers every
          # descendant even when the Rust assertion failed before its local
          # RAII cleanup ran. The fixed namespace and ownership checks above
          # make this safe against a broadened cleanup target.
          sudo sh -c 'printf "1\\n" > "$1/cgroup.kill"' cleanup-cgroup-root "$root"
          for _ in $(seq 1 100); do
            if [ "$(sudo awk '$1 == "populated" { print $2 }' "$root/cgroup.events")" = '0' ]; then
              break
            fi
            sleep 0.05
          done
          test "$(sudo awk '$1 == "populated" { print $2 }' "$root/cgroup.events")" = '0'
          test -z "$(sudo cat "$root/cgroup.procs")"

          while IFS= read -r -d '' leaf; do
            leaf_name="${leaf##*/}"
            case "$leaf_name" in
              guardian-e2e-[0-9]*-[0-9]*) ;;
              *)
                echo "refusing to clean an unexpected cgroup leaf: $leaf" >&2
                exit 1
                ;;
            esac
            [[ "$leaf" =~ ^/sys/fs/cgroup/agent-runtime-e2e-[0-9]+-[0-9]+/guardian-e2e-[0-9]+-[0-9]+$ ]]
            sudo sh -c 'printf "1\\n" > "$1/cgroup.kill"' cleanup-cgroup-leaf "$leaf"
            for _ in $(seq 1 100); do
              if [ "$(sudo awk '$1 == "populated" { print $2 }' "$leaf/cgroup.events")" = '0' ]; then
                break
              fi
              sleep 0.05
            done
            test "$(sudo awk '$1 == "populated" { print $2 }' "$leaf/cgroup.events")" = '0'
            test -z "$(sudo cat "$leaf/cgroup.procs")"
            sudo rmdir "$leaf"
          done < <(sudo find "$root" -mindepth 1 -maxdepth 1 -type d -print0)

          test "$(sudo awk '$1 == "populated" { print $2 }' "$root/cgroup.events")" = '0'
          test -z "$(sudo cat "$root/cgroup.procs")"
          sudo rmdir "$root"
