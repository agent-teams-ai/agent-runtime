      #     const readEvidence = name => JSON.parse(readFileSync(`docs/spikes/${name}.json`, 'utf8'));
      #     const historical = readEvidence('runtime-setup-l0-dogfooding-evidence');
      #     const adoption = readEvidence('runtime-setup-assembly-adoption-evidence');
      #     const adoptionV2 = readEvidence('runtime-setup-assembly-adoption-v2-evidence');
      #     const revisions = [...new Set([
      #       ...changes.map(({ revision }) => revision),
      #       ...historical.historicalChanges.map(({ revision }) => revision),
      #       historical.sourceRevision, adoption.sourceRevision,
      #       adoptionV2.historical.revision, adoptionV2.retainedV1.revision,
      #       adoptionV2.identity.sourceRevision,
      #     ])];
      #     for (const revision of revisions) assert.match(revision, /^[a-f0-9]{40}$/u);
      #     const hasTrees = revision => [revision, `${revision}^`].every(ref =>
      #       spawnSync('git', ['cat-file', '-e', `${ref}^{tree}`]).status === 0);
      #     const missing = revisions.filter(revision => !hasTrees(revision));
      #     if (missing.length) execFileSync('git', [
      #       'fetch', '--no-tags', '--no-write-fetch-head',
