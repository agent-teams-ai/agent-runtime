name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # Full history: Git-reading checks such as the SDK growth source
          # collector tests resolve retained commits on main.
          fetch-depth: 0

      - name: Verify checkout revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Disabled by owner decision 2026-10-02 (AR-0): only the L0 receipt
      # regression and the frozen C0 validator need these unreachable commits,
      # and neither runs in `pnpm check` any more. Restore this step together
