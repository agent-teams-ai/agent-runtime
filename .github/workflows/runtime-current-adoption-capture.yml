name: runtime-current-adoption-capture

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    name: capture (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    services:
      postgres:
        image: ${{ matrix.target == 'linux-x64' && 'postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636' || '' }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Reserve bounded capture artifact directory
        shell: bash
        env:
          CAPTURE_OUTPUT_DIR: ${{ runner.temp }}/adoption-current-${{ github.event.pull_request.head.sha }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir "$CAPTURE_OUTPUT_DIR"
          echo "CAPTURE_OUTPUT_DIR=$CAPTURE_OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: Checkout exact pull request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source revision
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"

      - name: Fetch retained evidence objects
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync, spawnSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          import {changes} from './scripts/architecture/runtime-setup-l0-evidence-spec.mjs';
          const historical = JSON.parse(readFileSync('docs/spikes/runtime-setup-l0-dogfooding-evidence.json'));
          const v1 = JSON.parse(readFileSync('docs/spikes/runtime-setup-assembly-adoption-evidence.json'));
          const v2 = JSON.parse(readFileSync('docs/spikes/runtime-setup-assembly-adoption-v2-evidence.json'));
          const revisions = [...new Set([...changes.map(x => x.revision),
            ...historical.historicalChanges.map(x => x.revision), historical.sourceRevision,
            v1.sourceRevision, v2.historical.revision, v2.retainedV1.revision,
            v2.identity.sourceRevision])];
          for (const revision of revisions) assert.match(revision, /^[a-f0-9]{40}$/u);
          const missing = revisions.filter(revision =>
            [revision, `${revision}^`].some(ref =>
              spawnSync('git', ['cat-file', '-e', `${ref}^{tree}`]).status !== 0));
          if (missing.length) execFileSync('git', ['fetch', '--no-tags', '--no-write-fetch-head',
            'https://github.com/agent-teams-ai/agent-runtime.git', ...missing], {stdio: 'inherit', timeout: 120_000});
          for (const revision of revisions) assert.equal(
            spawnSync('git', ['cat-file', '-e', `${revision}^{tree}`]).status, 0);
          NODE

      - name: Setup Node 24.18.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable pnpm 11.18.0
        run: |
          corepack enable
          corepack install --global pnpm@11.18.0

      - name: Verify target and strict tools
        shell: bash
        env:
          CAPTURE_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.equal(`${process.platform}-${process.arch}`, process.env.CAPTURE_TARGET);
          assert.equal(process.version, 'v24.18.0');
          NODE
          test "$(pnpm --version)" = '11.18.0'
          test -z "${NODE_OPTIONS:-}"
          test -z "${NODE_TEST_CONTEXT:-}"

      - name: Prove pinned pnpm rejects incompatible fixtures
        run: pnpm check:node-compat

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --engine-strict --strict-peer-dependencies

      - name: Check locked peer graph
        run: |
          pnpm install --resolution-only --lockfile-only --no-frozen-lockfile --engine-strict --strict-peer-dependencies
          git diff --exit-code -- pnpm-lock.yaml

      - name: Build workspace dependencies
        run: pnpm --filter '@agent-teams/embedded-runtime^...' -r run build

      - name: Create disposable Linux database
        if: matrix.target == 'linux-x64'
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          database="ar69_pa_test_${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres "$database"
          echo "AE_ACL_POSTGRES_DISPOSABLE_URL=postgres://postgres:postgres@127.0.0.1:5432/$database" >> "$GITHUB_ENV"

      - name: Capture exact original receipt and artifacts
        shell: bash
        env:
          CAPTURE_TARGET: ${{ matrix.target }}
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/architecture/runtime-setup-l0-evidence.mjs \
            --capture-adoption-receipt --output "$CAPTURE_OUTPUT_DIR/$CAPTURE_TARGET.json" \
            --run-id "$SOURCE_REVISION-$CAPTURE_TARGET-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Record failed capture diagnostics
        if: failure() && env.CAPTURE_OUTPUT_DIR != ''
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            printf 'source=%s\n' "$SOURCE_REVISION"
            printf 'checkout=%s\n' "$(git rev-parse HEAD)"
            printf 'node=%s\n' "$(node --version)"
            printf 'pnpm=%s\n' "$(pnpm --version)"
            printf 'job=failed; see workflow step logs for the failing command\n'
          } > "$CAPTURE_OUTPUT_DIR/failure-diagnostics.txt"

      - name: Upload receipt or failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-adoption-${{ github.event.pull_request.head.sha }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adoption-current-${{ github.event.pull_request.head.sha }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: warn
