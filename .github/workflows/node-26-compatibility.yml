name: Node 26 Compatibility

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-26-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: install-build-runtime (Node 26.10.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"

      - name: Setup qualified Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.10.0

      - name: Audit dependency Node engines
        run: node scripts/ci/audit-node-engine-compatibility.mjs --check

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.18.0

      - name: Install dependencies strictly
        run: pnpm install --frozen-lockfile

      - name: Run Node compatibility guards
        run: pnpm check:node-compat

      - name: Build workspace artifacts
        run: pnpm --filter './packages/**' -r run clean && pnpm product:build

      - name: Run synthetic package runtime tests
        run: pnpm --filter './packages/**' -r run test
