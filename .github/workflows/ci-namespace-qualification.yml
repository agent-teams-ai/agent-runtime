name: Namespace full product qualification

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  qualification:
    runs-on: namespace-profile-macos-15
    timeout-minutes: 30
    env:
      GIT_AUTHOR_NAME: iliya
      GIT_AUTHOR_EMAIL: iliyazelenkog@gmail.com
      GIT_COMMITTER_NAME: iliya
      GIT_COMMITTER_EMAIL: iliyazelenkog@gmail.com
      EXPECTED_REVISION: ${{ github.workflow_sha }}
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify checkout before running repository code
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Bind disposable evidence path
        shell: bash
        run: |
          set -euo pipefail
          printf 'CI_EVIDENCE_DIR=%s/ci-namespace-qualification\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Verify typed revision binding
        run: node scripts/ci/gate.ts revision
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run original full product checks
        id: product
        run: pnpm product:check
      - name: Capture actual Namespace platform and native evidence
        if: ${{ always() }}
        env:
          PRODUCT_OUTCOME: ${{ steps.product.outcome }}
        run: node scripts/ci/namespace-qualification.ts
      - name: Retain every qualification attempt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: namespace-product-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-namespace-qualification/
          if-no-files-found: error
          retention-days: 14
