name: Full Darwin packages

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string

permissions:
  contents: read

jobs:
  packages:
    runs-on: macos-15
    # Same physical runner image, compiler and SDK across all eight exact shards.
    timeout-minutes: 45
    env:
      GIT_AUTHOR_NAME: iliya
      GIT_AUTHOR_EMAIL: iliyazelenkog@gmail.com
      GIT_COMMITTER_NAME: iliya
      GIT_COMMITTER_EMAIL: iliyazelenkog@gmail.com
      EXPECTED_REVISION: ${{ inputs.revision }}
      EXECUTION_TARGET: darwin-arm64
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify checkout before running repository code
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Retain exact C0 review history before repository code
        shell: bash
        run: |
          set -euo pipefail
          object=8e5e859d10981e1623d0617e933afc68a9e8770c
          if ! git cat-file -e "$object^{commit}"; then
            git fetch --no-tags origin "$object"
          fi
          test "$(git rev-parse "$object^{commit}")" = "$object"
          git fsck --connectivity-only --no-reflogs "$object"
      - name: Setup Node 24 Corepack source
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Verify typed revision binding
        run: node scripts/ci/gate.ts revision
      - name: Enable pinned pnpm
        run: |
          selectedNode="$(node -p 'process.execPath')"
          corepackJs="$RUNNER_TOOL_CACHE/node/24.21.0/$(node -p 'process.arch')/lib/node_modules/corepack/dist/corepack.js"
          test -f "$corepackJs"
          export COREPACK_HOME="$RUNNER_TEMP/node-toolchain/corepack"
          mkdir -p "$RUNNER_TEMP/node-toolchain/bin" "$COREPACK_HOME"
          printf '#!/bin/sh\nexec "%s" "%s" pnpm "$@"\n' "$selectedNode" "$corepackJs" > "$RUNNER_TEMP/node-toolchain/bin/pnpm"
          chmod 755 "$RUNNER_TEMP/node-toolchain/bin/pnpm"
          printf '%s\n' "$RUNNER_TEMP/node-toolchain/bin" >> "$GITHUB_PATH"
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          "$selectedNode" "$corepackJs" pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Bind disposable evidence paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-darwin-shards"
          printf 'CI_EVIDENCE_DIR=%s/ci-darwin-shards\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Execute all eight actual product shards on one macOS runner
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for shard in agent-execution-1 agent-execution-2 agent-execution-3 provider-access runtime-configuration runtime-security embedded-runtime filesystem-custody; do
            if ! PACKAGE_SHARD="$shard" CI_EVIDENCE_DIR="$CI_EVIDENCE_DIR/$shard" node scripts/ci/package-execution.ts; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Retain agent-execution-1 attempt including failed observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-ci-darwin-package-agent-execution-1-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-darwin-shards/agent-execution-1/
          if-no-files-found: error
          retention-days: 14
      - name: Publish successful agent-execution-1 current unit
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-ci-darwin-package-agent-execution-1-current
          path: ${{ runner.temp }}/ci-darwin-shards/agent-execution-1/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Retain agent-execution-2 attempt including failed observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-ci-darwin-package-agent-execution-2-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-darwin-shards/agent-execution-2/
