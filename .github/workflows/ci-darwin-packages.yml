name: Full Darwin packages

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string

permissions:
  contents: read

jobs:
  packages:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [agent-execution-1, agent-execution-2, agent-execution-3, provider-access, runtime-configuration, runtime-security, embedded-runtime, filesystem-custody]
    env:
      GIT_AUTHOR_NAME: iliya
      GIT_AUTHOR_EMAIL: iliyazelenkog@gmail.com
      GIT_COMMITTER_NAME: iliya
      GIT_COMMITTER_EMAIL: iliyazelenkog@gmail.com
      EXPECTED_REVISION: ${{ inputs.revision }}
      EXECUTION_TARGET: darwin-arm64
      PACKAGE_SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify checkout before running repository code
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Retain exact C0 review history before repository code
        shell: bash
        run: |
          set -euo pipefail
          object=8e5e859d10981e1623d0617e933afc68a9e8770c
          if ! git cat-file -e "$object^{commit}"; then
            git fetch --no-tags origin "$object"
          fi
          test "$(git rev-parse "$object^{commit}")" = "$object"
          git fsck --connectivity-only --no-reflogs "$object"
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Verify typed revision binding
        run: node scripts/ci/gate.ts revision
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Bind disposable evidence paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'CI_EVIDENCE_DIR=%s/ci-darwin-shard\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Execute the actual full product shard
        run: node scripts/ci/package-execution.ts
      - name: Retain every attempt including failed observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-ci-darwin-package-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-darwin-shard/
          if-no-files-found: error
          retention-days: 14
      - name: Publish the successful same-run current unit
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-ci-darwin-package-${{ matrix.shard }}-current
          path: ${{ runner.temp }}/ci-darwin-shard/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
