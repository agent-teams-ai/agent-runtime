name: Host HTTP Evidence Native PostgreSQL TEST

on:
  pull_request:
    paths:
      - ".github/workflows/host-http-evidence-native-pg.yml"
      - "packages/contexts/agent-execution/tests/features/contained-agent-turn/postgres-http-egress-evidence.test.ts"
      - "packages/contexts/agent-execution/tests/features/contained-agent-turn/host-http-cross-boot-worker.ts"
      - "packages/contexts/agent-execution/tests/features/contained-agent-turn/host-http-admission-postgres-spike.ts"
      - "packages/contexts/agent-execution/tests/features/contained-agent-turn/http-egress-test-fixture.ts"
      - "tsconfig.json"
      - "packages/contexts/agent-execution/src/features/contained-agent-turn/**"

permissions:
  contents: read

jobs:
  native-evidence:
    name: PostgreSQL 18 / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["24.21.0", "26.11.1"]
    services:
      postgres:
        image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify checked-out SHA
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Setup Node 24 Corepack source
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Setup selected Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          selectedNode="$(node -p 'process.execPath')"
          corepackJs="$RUNNER_TOOL_CACHE/node/24.21.0/$(node -p 'process.arch')/lib/node_modules/corepack/dist/corepack.js"
          test -f "$corepackJs"
          export COREPACK_HOME="$RUNNER_TEMP/node-toolchain/corepack"
          mkdir -p "$RUNNER_TEMP/node-toolchain/bin" "$COREPACK_HOME"
          printf '#!/bin/sh\nexec "%s" "%s" pnpm "$@"\n' "$selectedNode" "$corepackJs" > "$RUNNER_TEMP/node-toolchain/bin/pnpm"
          chmod 755 "$RUNNER_TEMP/node-toolchain/bin/pnpm"
          printf '%s\n' "$RUNNER_TEMP/node-toolchain/bin" >> "$GITHUB_PATH"
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          "$selectedNode" "$corepackJs" pnpm --version
      - name: Build actual owner adapters
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @agent-teams/agent-execution... build
      - name: Create fresh disposable HTTP evidence database
        env:
          POSTGRES_SERVICE: ${{ job.services.postgres.id }}
        run: docker exec "$POSTGRES_SERVICE" createdb -U postgres http_evidence_test_ci
      - name: Run native PostgreSQL owner composition, no skips
        working-directory: packages/contexts/agent-execution
        env:
          HOST_HTTP_EVIDENCE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/http_evidence_test_ci
          HOST_HTTP_EVIDENCE_TEST_FRESH_DATABASE: "yes"
        run: |
          set -o pipefail
          node --test --test-reporter=tap --test-concurrency=1 tests/features/contained-agent-turn/postgres-http-egress-evidence.test.ts | tee "$RUNNER_TEMP/host-http-evidence.tap"
          for line in '# fail 0' '# cancelled 0' '# skipped 0' '# todo 0'; do
            grep -Fx "$line" "$RUNNER_TEMP/host-http-evidence.tap"
          done
          grep -F 'real PostgreSQL race, ambiguous COMMIT and fresh-pool reload' "$RUNNER_TEMP/host-http-evidence.tap"
