name: AR C0 retained evidence

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ar-c0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ar-c0
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository with retained history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify checkout revision
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Validate retained AR C0 evidence
        env:
          GIT_AUTHOR_NAME: Synthetic Evidence Test
          GIT_AUTHOR_EMAIL: test@example.invalid
          GIT_COMMITTER_NAME: Synthetic Evidence Test
          GIT_COMMITTER_EMAIL: test@example.invalid
        run: node scripts/architecture/validate-ar-c0.mjs && node --test scripts/architecture/validate-ar-c0.test.mjs
