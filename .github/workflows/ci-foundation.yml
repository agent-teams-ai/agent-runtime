name: Full Foundation gate

# Complete original Foundation coverage on every full CI call.
on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      artifact:
        required: true
        type: string

permissions:
  contents: read

jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2]
    uses: ./.github/workflows/ci-foundation-shard.yml
    with:
      revision: ${{ inputs.revision }}
      artifact: ${{ inputs.artifact }}
      index: ${{ matrix.index }}

  remainder:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    env:
      GIT_AUTHOR_NAME: iliya
      GIT_AUTHOR_EMAIL: iliyazelenkog@gmail.com
      GIT_COMMITTER_NAME: iliya
      GIT_COMMITTER_EMAIL: iliyazelenkog@gmail.com
      EXPECTED_REVISION: ${{ inputs.revision }}
      ARTIFACT_PREFIX: ${{ inputs.artifact }}
    steps:
      - name: Checkout exact revision with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
          fetch-depth: 0
      - name: Guard inputs and retained C0 before repository code
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ARTIFACT_PREFIX" =~ ^[a-z][a-z0-9-]{0,60}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          object=8e5e859d10981e1623d0617e933afc68a9e8770c
          if ! git cat-file -e "$object^{commit}"; then
            git fetch --no-tags origin "$object"
          fi
          test "$(git rev-parse "$object^{commit}")" = "$object"
          git fsck --connectivity-only --no-reflogs "$object"
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.18.0
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Run every original remainder command in serial order
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/foundation-evidence"
          phase() {
            local label="$1" start end status
            shift
            start=$(date +%s%3N)
            set +e
            "$@"
            status=$?
            set -e
            end=$(date +%s%3N)
            jq -n --arg revision "$EXPECTED_REVISION" --arg phase "$label" \
              --arg command "$*" --argjson exitCode "$status" --argjson start "$start" --argjson end "$end" \
              '{revision:$revision,phase:$phase,command:$command,exitCode:$exitCode,start:$start,end:$end}' \
              > "$RUNNER_TEMP/foundation-evidence/remainder-$label.json"
            test "$status" -eq 0
          }
          phase 0 ./node_modules/.bin/agent-teams-foundation check
          phase 1 node --test scripts/docs/runtime-builtin-permissions.test.mjs scripts/ci/run-ordinary-postgres.test.mjs
          phase 2 pnpm foundation:assert-dev-only
          phase 3 pnpm foundation:assert-registry
          phase 4 pnpm quality:adoption
          phase 5 pnpm foundation:scaffold:check
      - name: Retain remainder phase evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-${{ env.ARTIFACT_PREFIX }}-remainder-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundation-evidence/remainder-*.json
          if-no-files-found: error
          retention-days: 14
      # Same-run successful evidence survives rerun-failed; attempt archives remain.
      - name: Publish successful remainder for same-run retries
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-${{ env.ARTIFACT_PREFIX }}-remainder-current
          path: ${{ runner.temp }}/foundation-evidence/remainder-*.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  aggregate:
    if: ${{ always() }}
    needs: [fixtures, remainder]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    env:
      GIT_AUTHOR_NAME: iliya
      GIT_AUTHOR_EMAIL: iliyazelenkog@gmail.com
      GIT_COMMITTER_NAME: iliya
      GIT_COMMITTER_EMAIL: iliyazelenkog@gmail.com
      EXPECTED_REVISION: ${{ inputs.revision }}
      ARTIFACT_PREFIX: ${{ inputs.artifact }}
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Checkout exact revision with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
          fetch-depth: 0
      - name: Guard inputs and retained C0 before repository code
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ARTIFACT_PREFIX" =~ ^[a-z][a-z0-9-]{0,60}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          object=8e5e859d10981e1623d0617e933afc68a9e8770c
          if ! git cat-file -e "$object^{commit}"; then
            git fetch --no-tags origin "$object"
          fi
          test "$(git rev-parse "$object^{commit}")" = "$object"
          git fsck --connectivity-only --no-reflogs "$object"
      - name: Setup pinned Node for aggregate environment
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Enable pinned pnpm for aggregate environment
        run: |
          corepack enable
          corepack install --global pnpm@11.18.0
      - name: Frozen install for aggregate environment
        run: pnpm install --frozen-lockfile
      - name: Download every fixture and remainder report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: foundation-${{ env.ARTIFACT_PREFIX }}-*-current
          path: ${{ runner.temp }}/foundation-evidence
          merge-multiple: false
      - name: Require complete observed coverage and successful remainder
        shell: bash
        run: |
          set -euo pipefail
          jq -en --argjson needs "$NEEDS" \
            '$needs | keys == ["fixtures","remainder"] and all(.[]; .result == "success")'
          # This oracle reads the actual original-file registrations, never the helper table.
          expected=$(sed -n 's/^  test("\([^"]*\)",.*$/\1/p' scripts/architecture/source-dependency-adapter-boundaries.test.mjs | jq -Rsc 'split("\n")[:-1]')
          mapfile -t shards < <(find "$RUNNER_TEMP/foundation-evidence" -type f -name 'shard-*.json' | sort)
          mapfile -t remainder < <(find "$RUNNER_TEMP/foundation-evidence" -type f -name 'remainder-*.json' | sort)
          test "${#shards[@]}" -eq 3
          test "${#remainder[@]}" -eq 6
          jq -se --arg revision "$EXPECTED_REVISION" --argjson expected "$expected" '
            ($expected | length == 25 and (unique | length == 25)) and
            (sort_by(.index) | map(.index) == [0,1,2]) and
            all(.[];
              .protocol == "foundation-fixtures/1" and .revision == $revision and .exitCode == 0 and
              (.start | type == "number") and (.end >= .start) and
              (.registrations | length == 1) and
              (.registrations[0] as $r |
                $r.protocol == "foundation-fixtures/1" and $r.index == .index and $r.count == 3 and
                $r.encountered == $expected and
                $r.registered == [$expected | to_entries[] | select(.key % 3 == $r.index) | .value] and
                $r.excluded == [$expected | to_entries[] | select(.key % 3 != $r.index) | .value] and
                ([.events[] | select(.type == "test") | .name] == $r.registered) and
                ([.events[] | select(.type == "suite") | .name] == ["installed Foundation adapter boundary checks"]) and
                (.events | length == ($r.registered | length) + 1) and
                all(.events[]; .status == "passed" and .skip == false and .todo == false and
                  ((.type == "test" and .nesting == 1) or (.type == "suite" and .nesting == 0))) and
                (.summaries | length > 0) and all(.summaries[];
                  .success == true and .counts.tests == ($r.registered | length) and
                  .counts.passed == .counts.tests and .counts.suites == 1 and
                  .counts.failed == 0 and .counts.cancelled == 0 and .counts.skipped == 0 and .counts.todo == 0))) and
            ([.[].registrations[0].registered[]] | sort == ($expected | sort))
          ' "${shards[@]}"
          jq -se --arg revision "$EXPECTED_REVISION" '
            sort_by(.phase) | . as $phases | map(.command) == [
              "./node_modules/.bin/agent-teams-foundation check",
              "node --test scripts/docs/runtime-builtin-permissions.test.mjs scripts/ci/run-ordinary-postgres.test.mjs",
              "pnpm foundation:assert-dev-only", "pnpm foundation:assert-registry",
              "pnpm quality:adoption", "pnpm foundation:scaffold:check"] and
            map(.phase) == ["0","1","2","3","4","5"] and
            all(.[]; .revision == $revision and .exitCode == 0 and (.start | type == "number") and .end >= .start) and
            all(range(1;6); . as $i | $phases[$i].start >= $phases[$i - 1].end)
          ' "${remainder[@]}"
