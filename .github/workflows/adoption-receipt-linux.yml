            d7b99516a781cc1ce24d81922da5d1c674910ad2 \
            d7c875a60ac8e59eb1d097bdb0f0926991a1ed99 \
            d813450a018c2558ae8b711fc6d726e9eb542899 \
            d8442bdc456e1cc937b3ee753c237d479ca8baab \
            da91fc9ad67e4a5d3f34f9f34db737fe7035ebaa \
            dbbb1c8fe585d3df6ff0251265d70086409aa99a \
            e615369d50ed73cac6e00909fcc8f6705b0d6973 \
            f277cd55640c892f8bef3384407b73f2f366f434 \
            fb2932fb8b846cc9c92ace7aa208df1d8bd93c5e \
            ff82eb593bad665937bae5ffdf10593f4179387d

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm --filter "@agent-teams/embedded-runtime^..." -r run build

      - name: Capture Linux x64 adoption receipt
        env:
          AE_ACL_POSTGRES_DISPOSABLE_URL: postgres://postgres:postgres@127.0.0.1:5432/ar69_pa_test_adoptionreceipt
          CAPTURE_RUN_ID: linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p /tmp/receipt
          node scripts/architecture/runtime-setup-l0-evidence.mjs \
            --capture-adoption-receipt --output /tmp/receipt/linux-x64.json \
            --run-id "$CAPTURE_RUN_ID"

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64-adoption-receipt
          path: /tmp/receipt/
          retention-days: 7
          if-no-files-found: warn
