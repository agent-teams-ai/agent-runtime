name: adoption-receipt-linux

# Temporary workflow, scoped to this one branch only: produces the Linux x64
# adoption receipt required by docs/architecture/get-modular-adoption.md's
# paired capture runbook. Not wired into pull_request or main-branch push.
# Safe to delete once the receipt has been captured and merged.

on:
  push:
    branches:
      - feat/async-assembly-adapter
      - refactor/fms-runtime-security-setup-authorization
      - refactor/fms-contained-turn-egress
      - refactor/fms-host-boundaries
      - refactor/fms-final-integration
      - refactor/fms-rs-egress-primitives
      - refactor/fms-runtime-configuration-entrypoints
      - refactor/fms-rc-feature-tests
      - fix/contained-turn-final-qualification
      - cursor/fms-rs-v1-mapper-split-7d17
      - cursor/fms-host-runtime-access-7d17
      - cursor/fms-host-http-pa-7d17
      - cursor/fms-host-pa-rs-7d17
      - refactor/fms-host-pa-rs
      - cursor/fms-host-validation-7d17
      - refactor/fms-host-validation
      - refactor/fms-host-runtime-validation
      - refactor/fms-host-http-egress
      - chore/classify-native-helper-test
      - chore/classify-native-helper-test
      - cursor/fms-linux-deploy-7d17
      - cursor/fms-host-leftover-7d17
      - cursor/fms-setup-views-linux-7d17
      - cursor/fms-runtime-access-linux-7d17
      - cursor/fms-rc-layer-linux-7d17
      - cursor/fms-rs-barrels-linux-7d17
      - cursor/fms-rc-package-arch-load-7d17
      - cursor/fms-rc-activation-linux-7d17
      - cursor/fms-rs-activation-linux-7d17
      - cursor/fms-host-assembly-grammar-7d17
      - cursor/fms-host-readmes-7d17
      - cursor/fms-host-feature-tests-7d17
      - cursor/fms-host-package-tests-7d17
      - cursor/fms-host-mixed-package-7d17
      - cursor/fms-host-rsa-package-7d17
      - cursor/fms-host-assembly-ref-7d17
      - cursor/fms-host-multi-package-7d17
      - cursor/fms-host-root-tests-7d17
      - cursor/fms-host-packed-consumer-7d17
      - cursor/fms-host-recipe-owners-7d17
      - cursor/fms-host-live-selection-7d17
      - cursor/fms-host-live-admin-7d17
      - cursor/fms-host-live-admin-setup-7d17
      - cursor/fms-host-live-bootstrap-7d17
      - cursor/fms-host-live-canary-7d17
      - cursor/fms-host-live-darwin-infra-7d17
      - docs/sr-contained-turn-anti-patterns
      - refactor/fms-host-access-invariants
      - refactor/fms-host-darwin-deployment

permissions:
  contents: read

jobs:
  capture:
    name: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: ar69_pa_test_adoptionreceipt
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ar69_pa_test_adoptionreceipt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # L0/adoption evidence authenticates retained historical Git objects.
          fetch-depth: 0

      - name: Verify checkout revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      # The retained L0/adoption historical ledger references commits from
      # squash-merged branches; a normal branch/tag fetch does not include
      # objects unreachable from any current ref. Fetch each by exact SHA
      # (GitHub serves any commit it still has, reachable or not).
      - name: Fetch retained historical objects
        shell: bash
        run: |
          git fetch origin --no-tags \
            01dc2418c963586d43e92221a01ebcdb11e756f4 \
            038080795baabe54bcc4ef89dbedf334becc2acf \
            089ee44e9ccc43336ca32bd6a7be07b71d995e48 \
            08fb1a71b75134b43af52579e8de86a44b2a3815 \
