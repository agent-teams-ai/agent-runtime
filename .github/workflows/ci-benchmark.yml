name: CI scheduling benchmark

# TEMPORARY diagnostic-branch definition. Never merge into required CI.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: worker-signal-diagnostic-${{ github.workflow_sha }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  worker-signal-diagnostic:
    name: diagnostic-only actual Worker signal observation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GIT_AUTHOR_NAME: iliya
      GIT_AUTHOR_EMAIL: iliyazelenkog@gmail.com
      GIT_COMMITTER_NAME: iliya
      GIT_COMMITTER_EMAIL: iliyazelenkog@gmail.com
    steps:
      - name: Checkout reviewed diagnostic observer separately
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout unchanged target source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 8b1735d716491445d8d9b97efec4adb40557ea5b
          path: target
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact independent checkouts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          test "$(git -C target rev-parse HEAD)" = 8b1735d716491445d8d9b97efec4adb40557ea5b
          test -z "$(git -C target status --porcelain)"
          object=8e5e859d10981e1623d0617e933afc68a9e8770c
          if ! git -C target cat-file -e "$object^{commit}"; then
            git -C target fetch --no-tags origin "$object"
          fi
          git -C target fsck --connectivity-only --no-reflogs "$object"
      - name: Setup Node 24 Corepack source
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Preserve exact Node 24 TEST executable
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.version')" = v24.21.0
          printf 'NODE24_TEST_EXECUTABLE=%s\n' "$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - name: Setup pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: target/.node-version
          package-manager-cache: false
      - name: Enable pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          selectedNode="$(node -p 'process.execPath')"
          test "$(node -p 'process.version')" = v26.11.1
          corepackJs="$RUNNER_TOOL_CACHE/node/24.21.0/$(node -p 'process.arch')/lib/node_modules/corepack/dist/corepack.js"
          test -f "$corepackJs"
          export COREPACK_HOME="$RUNNER_TEMP/node-toolchain/corepack"
          mkdir -p "$RUNNER_TEMP/node-toolchain/bin" "$COREPACK_HOME"
          printf '#!/bin/sh\nexec "%s" "%s" pnpm "$@"\n' "$selectedNode" "$corepackJs" > "$RUNNER_TEMP/node-toolchain/bin/pnpm"
          chmod 755 "$RUNNER_TEMP/node-toolchain/bin/pnpm"
          printf '%s\n' "$RUNNER_TEMP/node-toolchain/bin" >> "$GITHUB_PATH"
          printf 'COREPACK_HOME=%s\n' "$COREPACK_HOME" >> "$GITHUB_ENV"
          "$selectedNode" "$corepackJs" pnpm --version
      - name: Install unchanged target dependencies
        working-directory: target
        run: pnpm install --frozen-lockfile
      - name: Bind disposable diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/TEST-runner-worker-signal-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$evidence"
          printf 'CI_EVIDENCE_DIR=%s\n' "$evidence" >> "$GITHUB_ENV"
      - name: Observe bound Listener shutdown codes and memory while running unchanged quick measure
        shell: bash
        run: |
          set -euo pipefail
          node scripts/diagnostics/runner-listener-shutdown-observer.mts --target "$GITHUB_WORKSPACE/target" | tee "$CI_EVIDENCE_DIR/listener-memory-metadata.txt"
      - name: Retain diagnostic-only evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-worker-signal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_EVIDENCE_DIR }}/
          if-no-files-found: error
          retention-days: 14
